name: Verify curriculum and runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Tcl
        run: sudo apt-get update && sudo apt-get install -y tcl
      - name: Generate curriculum
        run: |
          python3 scripts/build_curriculum.py
          python3 scripts/build_adventures.py
          python3 scripts/build_messages.py
          python3 scripts/build_english.py
          python3 scripts/build_english_adventures.py
          python3 scripts/build_trace.py
          node scripts/export_artwork.mjs
          python3 scripts/build_assets.py
      - name: Check generated files
        run: git diff --exit-code -- site lessons
      - name: Execute examples and solutions in Tcl
        run: |
          python3 scripts/check.py --all
          python3 tests/adventures.py
      - name: Verify actual browser WASM runtime
        run: node tests/wasm.mjs
      - name: Verify sound lifecycle
        run: |
          node tests/sound.mjs
          node tests/action-sounds.mjs
      - name: Verify site and media
        run: |
          python3 tests/site_integrity.py
          python3 tests/localization.py
          python3 tests/artwork.py
      - name: Parse JavaScript
        run: |
          node --check site/app.js
          node --check site/adventure.js
          node --check site/adventure-art.js
          node --check site/runner.js
          node --check site/live-runtime.js
          node --check site/runtime-story.js
          node --check site/i18n.js
          node --check site/locale-core.js
          node --check site/sound.js
          node --check site/action-sounds.js
          node --check site/celebrate.js
